name: Build .deb

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The build jobs compile upstream nsjail, i.e. run upstream code, so they get a read-only token.
# Only the jobs that run no upstream code get write access, each just for what it needs.
permissions:
  contents: read

jobs:
  # The committed top entry of debian/changelog, which the release is tagged from.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pkg-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute package version
        id: pkg-version
        run: echo "version=$(dpkg-parsechangelog -SVersion)" >>"$GITHUB_OUTPUT"

  pr-comment:
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      # message-id makes this a sticky comment, updated in place on later pushes to the PR.
      - name: Comment package version on PR
        uses: mshick/add-pr-comment@v3.12.0
        with:
          message: >-
            Package version: `${{ needs.version.outputs.version }}`. Merging will release
            `v${{ needs.version.outputs.version }}`, unless that tag already exists.
          message-id: pkg-version

  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # build-dep installs debian/control's Build-Depends plus build-essential. devscripts
      # provides dch for scripts/build.sh, which a package build itself doesn't need.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get build-dep -y ./
          sudo apt-get install -y devscripts

      - name: Build .deb
        run: bash scripts/build.sh

      - name: Install .deb
        run: sudo apt-get install -y ./nsjail_*.deb

      - name: Install smoke-test dependencies
        run: |
          sudo apt-get install -y wget python3 strace busybox-static passt

      - name: Run smoke test
        run: bash scripts/ci-smoke-test.sh

      - name: Upload .deb artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nsjail-deb-ubuntu24.04
          path: nsjail_*.deb

  build-debian:
    runs-on: ubuntu-24.04
    container:
      image: debian:13
      # nsjail's README documents `docker run --privileged` as how to run it in Docker at all.
      options: --privileged
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y git ca-certificates
          # The workspace is owned by the runner's UID, not the container's root, so git refuses
          # to run in it. actions/checkout's own safe.directory setting doesn't outlive its step.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get build-dep -y ./
          apt-get install -y devscripts

      - name: Build .deb
        run: bash scripts/build.sh debian

      - name: Install .deb
        run: apt-get install -y ./nsjail_*.deb

      - name: Install smoke-test dependencies
        run: |
          apt-get install -y wget python3 strace busybox-static passt

      # NSJAIL_SKIP_CONTAINER_QUIRKS skips 4 tests that are artifacts of running as root in a
      # bare `container:` job, see ci-smoke-test-README.md.
      - name: Run smoke test
        env:
          NSJAIL_SKIP_CONTAINER_QUIRKS: "1"
        run: bash scripts/ci-smoke-test.sh

      - name: Upload .deb artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nsjail-deb-debian13
          path: nsjail_*.deb

  # Releases whatever reaches main, from the .debs both build jobs just smoke-tested. A tag that
  # already exists means this version is out (e.g. a README-only commit), so nothing is released.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build-ubuntu, build-debian]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - name: Check whether the tag exists
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matches="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")"
          if [ "$matches" -gt 0 ]; then
            echo "$TAG already exists, nothing to release."
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.tag.outputs.exists == 'false'
        with:
          pattern: nsjail-deb-*
          merge-multiple: true
          path: debs

      # VERSION is read from the committed debian/changelog before the build, while the .debs
      # carry whatever version scripts/bump-changelog.sh settled on during it.
      - name: Check .deb versions match the tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          ls debs
          [ "$(find debs -name "nsjail_${VERSION}~*.deb" | wc -l)" -eq 2 ]

      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: debs/nsjail_*.deb
