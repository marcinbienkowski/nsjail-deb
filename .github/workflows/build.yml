name: Build .deb

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-ubuntu:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pkg-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Runs before the full build so the PR comment below shows up quickly, without waiting on
      # the build+smoke-test - the version this reads (debian/changelog's committed top entry)
      # doesn't depend on either.
      - name: Compute package version
        id: pkg-version
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          echo "version=$(dpkg-parsechangelog -SVersion)" >>"$GITHUB_OUTPUT"

      # message-id makes this a sticky comment - updated in place on later pushes to the PR
      # rather than piling up a new one each time.
      - name: Comment package version on PR
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v3.12.0
        with:
          message: >-
            Package version: `${{ steps.pkg-version.outputs.version }}`. Merging will release
            `v${{ steps.pkg-version.outputs.version }}`, unless that tag already exists.
          message-id: pkg-version

      - name: Install build dependencies
        run: |
          sudo apt-get install -y build-essential debhelper dh-apparmor devscripts dpkg-dev \
            protobuf-compiler libprotobuf-dev libnl-route-3-dev pkg-config \
            bison flex

      - name: Build .deb
        run: bash scripts/build.sh

      - name: Install .deb
        run: sudo apt-get install -y ./nsjail_*.deb

      - name: Install smoke-test dependencies
        run: |
          sudo apt-get install -y wget python3 strace busybox-static passt

      - name: Run smoke test
        run: bash scripts/ci-smoke-test.sh

      - name: Upload .deb artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nsjail-deb-ubuntu24.04
          path: nsjail_*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: nsjail_*.deb

  build-debian:
    runs-on: ubuntu-24.04
    container:
      image: debian:13
      # nsjail's README documents `docker run --privileged` as how to run it in Docker at all.
      options: --privileged
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y git ca-certificates
          # The workspace is owned by the runner's UID, not the container's root, so git refuses
          # to run in it. actions/checkout's own safe.directory setting doesn't outlive its step.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get install -y build-essential debhelper dh-apparmor devscripts dpkg-dev \
            protobuf-compiler libprotobuf-dev libnl-route-3-dev pkg-config \
            bison flex

      - name: Build .deb
        run: bash scripts/build.sh debian

      - name: Install .deb
        run: apt-get install -y ./nsjail_*.deb

      - name: Install smoke-test dependencies
        run: |
          apt-get install -y wget python3 strace busybox-static passt

      # NSJAIL_SKIP_CONTAINER_QUIRKS skips 4 tests that are artifacts of running as root in a
      # bare `container:` job, see ci-smoke-test-README.md.
      - name: Run smoke test
        env:
          NSJAIL_SKIP_CONTAINER_QUIRKS: "1"
        run: bash scripts/ci-smoke-test.sh

      - name: Upload .deb artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nsjail-deb-debian13
          path: nsjail_*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: nsjail_*.deb

  # Releases whatever reaches main, from the .debs both build jobs just smoke-tested. A tag that
  # already exists means this version is out (e.g. a README-only commit), so nothing is released.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-ubuntu, build-debian]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.build-ubuntu.outputs.version }}
      TAG: v${{ needs.build-ubuntu.outputs.version }}
    steps:
      - name: Check whether the tag exists
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matches="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")"
          if [ "$matches" -gt 0 ]; then
            echo "$TAG already exists, nothing to release."
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.tag.outputs.exists == 'false'
        with:
          pattern: nsjail-deb-*
          merge-multiple: true
          path: debs

      # VERSION is read from the committed debian/changelog before the build, while the .debs
      # carry whatever version scripts/bump-changelog.sh settled on during it.
      - name: Check .deb versions match the tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          ls debs
          [ "$(find debs -name "nsjail_${VERSION}~*.deb" | wc -l)" -eq 2 ]

      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: debs/nsjail_*.deb
